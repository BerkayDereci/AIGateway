name: ci
on: [push, pull_request]

# No live provider secrets: providers are faked over HTTP; the demo provider drives the e2e test.
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aigateway }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=aigateway
      Demo__Enabled: "true"
      DataProtection__KeyRingPath: /tmp/aigateway-keyring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: dotnet run --project src/AiGateway.Api -- --migrate
      - run: nohup dotnet run --project src/AiGateway.Api --no-launch-profile --urls http://localhost:5080 > api.log 2>&1 &
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: nohup npm run dev > vite.log 2>&1 &
        working-directory: web
      - run: npx wait-on -t 180000 http-get://localhost:5080/health/ready http-get://localhost:5173
        working-directory: web
      - run: ../scripts/smoke.sh http://localhost:5080
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - if: failure()
        run: cat api.log web/vite.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
